<!DOCTYPE html>
<html>
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<style>
body {background-color: white;}
h1 {
color: blue;
font-family: verdana;
font-size: 300%;
}
p {
color: red;
font-family: courier;
font-size: 160%;
border: 2px solid tomato;
padding: 30px;/* 内边距 */
margin: 50px;/* 外边距 */
}
a:link { 
color: green;
background-color: transparent;/* 默认值 设置为透明色 可忽略 */
text-decoration: none;/* 没有下划线 */
}/* 未访问过的链接 */
a:visited {
color: pink;
text-decoration: none;
}/* 已访问过的链接 */
a:hover {
color: red;
text-decoration:underline;
} /* 鼠标悬停状态 */
a:active {
color: yellow;
text-decoration: underline;
}/* 激活状态*/

button{
background-color: #f44336;
color: white;
padding: 15px 25px;
border:none;
font-size:16px;
}
button:hover, button:active {
background-color: red;
}
</style>
</head>
<body>
<h1>内部CSS</h1>
<p><a href="https://www.w3school.com.cn/" target="_self">访问 W3School.com.cn！</a></p><!-- 默认值。在点击链接的同一窗口/标签页中打开 -->
<p><a href="https://www.w3school.com.cn/" target="_blank">访问 W3School.com.cn！</a></p><!-- 在新窗口/标签页中打开 -->
<p><a href="https://www.w3school.com.cn/" target="_parent">访问 W3School.com.cn！</a></p><!-- 在父框架中打开 -->
<p><a href="https://www.w3school.com.cn/" target="_top">访问 W3School.com.cn！</a></p><!-- 在窗口的整个主体中打开 -->
<p><a href="https://www.w3school.com.cn/" ><img src="styles.png" alt="html教程" style="width:300px;height:100px"></a></p><br>
<p>点击此按钮进入HTML教程 <button onclick="document.location='https://www.w3school.com.cn/'" title="教程">HTML教程</button>
</p><!-- button是通过 js 'onclick'实现页面跳转 -->
<p><a href="button.html" target="_blank">不用 button，直接用 a 标签模拟按钮,不需要 js</a></p><br>

<p><a href="图像映射.html" target="_blank">图像映射</a></p>
<p><a href="背景图像.html" target="_blank">背景图像</a></p>
</body>
</html>
