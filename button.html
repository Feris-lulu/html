<!DOCTYPE html>
<html>
<head>
<style>
a:link, a:visited {
  background-color: #f44336;
  color: white;
  padding: 15px 25px; /* 内边距：上下15px，左右25px */
  text-align: center;
  text-decoration: none; /* 去掉链接默认下划线 */
  display: inline-block; /* 行内块元素！重点 */
}

a:hover, a:active {
  background-color: red;
}
</style>
</head>
<body>

<h1>链接按钮</h1>

<p>样式化为按钮的链接：</p>

<a href="/html/index.asp" target="_blank">这是一个链接</a>

</body>
</html>
